<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Roxysu Preview — mania notefield</title>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				background: #121212;
				overflow: hidden;
				font-family: system-ui, sans-serif;
			}
			body.transparent,
			body.transparent .stage {
				background: transparent !important;
			}
			html.hidden-play,
			html.hidden-play body,
			html.hidden-play body .stage {
				background: transparent !important;
			}
			html.hidden-play body .stage,
			html.hidden-play body .status,
			html.hidden-play body .panel-toggle,
			html.hidden-play body .panel {
				display: none !important;
			}
			.stage {
				position: fixed;
				left: 50%;
				top: 50%;
				width: var(--playfield-scale, 100%);
				height: var(--playfield-scale, 100%);
				transform: translate(-50%, -50%);
				background: #121212;
			}
			.notefield {
				display: block;
				width: 100%;
				height: 100%;
			}
			.status {
				position: fixed;
				left: 12px;
				top: 10px;
				right: 44px;
				color: rgba(255, 255, 255, 0.85);
				font-size: 14px;
				text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
				pointer-events: none;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.panel-toggle {
				position: fixed;
				right: 8px;
				top: 6px;
				z-index: 10;
				background: rgba(255, 255, 255, 0.08);
				color: rgba(255, 255, 255, 0.75);
				border: none;
				border-radius: 6px;
				width: 28px;
				height: 28px;
				font-size: 15px;
				cursor: pointer;
			}
			.panel-toggle:hover {
				background: rgba(255, 255, 255, 0.16);
			}
			.panel {
				position: fixed;
				right: 8px;
				top: 40px;
				z-index: 10;
				display: none;
				flex-direction: column;
				gap: 8px;
				width: 260px;
				padding: 12px;
				box-sizing: border-box;
				background: rgba(18, 18, 18, 0.92);
				border: 1px solid rgba(255, 255, 255, 0.1);
				border-radius: 10px;
				color: #eee;
				font-size: 13px;
			}
			.panel.open {
				display: flex;
			}
			.panel .row {
				display: flex;
				flex-direction: column;
				gap: 2px;
			}
			.panel input[type="range"] {
				width: 100%;
			}
			.panel .hint {
				color: rgba(255, 255, 255, 0.5);
				line-height: 1.4;
			}
			.panel button {
				background: rgba(255, 255, 255, 0.08);
				color: #eee;
				border: none;
				border-radius: 6px;
				padding: 6px 10px;
				font-size: 13px;
				cursor: pointer;
				text-align: left;
			}
			.panel button:hover {
				background: rgba(255, 255, 255, 0.16);
			}
			.panel .row button {
				width: 100%;
				margin-top: 4px;
			}
		</style>
	</head>
	<body>
		<script src="./bundle.js"></script>
	</body>
</html>
