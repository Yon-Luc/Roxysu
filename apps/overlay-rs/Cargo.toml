[package]
name = "roxysu-overlay"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Roxysu in-game overlay host (Rust; Phase 6 watchdog)"
license = "MIT"
publish = false

[[bin]]
name = "roxysu-overlay-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-channel = "2"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
# v4_10+ required so gtk::Accessible is exported (webkit6 implements it).
gtk4 = { version = "0.11", package = "gtk4", features = ["v4_14"] }
gdk4 = { version = "0.11", package = "gdk4", features = ["v4_14"] }
gtk4-layer-shell = { version = "0.8", features = ["v1_3"] }
webkit6 = "0.6"
glib = "0.22"
cairo-rs = "0.22"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
