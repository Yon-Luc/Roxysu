name: Desktop (Windows)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release tag to attach installers to (e.g. v0.1.0)"
        required: false
        type: string
  push:
    tags:
      - "v*"
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: desktop-win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows installer
    if: github.event_name == 'workflow_dispatch' || github.event.created
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      # Unsigned builds — fine for CI artifacts; users may see SmartScreen on first run.
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pin bundled Node to runner Node
        shell: bash
        run: |
          echo "ROXYSU_NODE_VERSION=$(node -p process.versions.node)" >> "$GITHUB_ENV"
          echo "Bundled Node will be $(node -p process.versions.node)"

      # Cache only Bun's download cache — NOT node_modules. Restoring Bun's
      # Windows junction/hardlink tree from actions/cache causes EPERM and
      # broken "react/jsx-runtime" resolution during build:ui.
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('apps/desktop/package.json', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Cache Node runtime downloads
        uses: actions/cache@v4
        with:
          path: apps/desktop/stage/node
          key: ${{ runner.os }}-roxysu-node-${{ env.ROXYSU_NODE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-roxysu-node-

      - name: Install dependencies
        # copyfile avoids flaky Windows hardlink/junction EPERM under Defender.
        run: bun install --frozen-lockfile --backend=copyfile

      - name: Sync package versions from release tag
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: bash
        run: |
          RAW="${{ inputs.release_tag || github.ref_name }}"
          # v0.1.0 / desktop-v0.1.0 → 0.1.0; leave plain semver as-is
          VER="${RAW#desktop-}"
          VER="${VER#v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Could not parse semver from tag/ref: $RAW"
            exit 1
          fi
          echo "Setting apps/desktop + apps/server version to $VER (from $RAW)"
          node -e "
            const fs = require('fs');
            for (const p of ['apps/desktop/package.json', 'apps/server/package.json']) {
              const j = JSON.parse(fs.readFileSync(p, 'utf8'));
              j.version = process.argv[1];
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            }
          " "$VER"

      - name: Setup MSVC for Win32 launcher
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Windows artifacts
        run: bun run desktop:dist:win
        env:
          ROXYSU_NODE_VERSION: ${{ env.ROXYSU_NODE_VERSION }}

      - name: Assert packaged layout
        run: bun run --cwd apps/desktop assert:packaged

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: roxysu-windows-${{ github.ref_name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          retention-days: 30
          if-no-files-found: error

      - name: Attach installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          fail_on_unmatched_files: true
