name: Desktop (Windows)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release tag to attach installers to (e.g. v0.1.0)"
        required: false
        type: string
  push:
    tags:
      - "v*"
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: desktop-win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      # Unsigned builds — fine for CI artifacts; users may see SmartScreen on first run.
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('apps/desktop/package.json', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows artifacts
        run: bun run desktop:dist:win

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: roxysu-windows-${{ github.ref_name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
          retention-days: 30
          if-no-files-found: error

      - name: Attach installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
          fail_on_unmatched_files: true
