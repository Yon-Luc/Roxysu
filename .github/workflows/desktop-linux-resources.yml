name: Desktop (Linux resources)

# Builds the Nix flake payload: Roxysu-*-linux-x64-resources.tar.gz
# (staged UI/server/realm + bundled Node). Attach to a GitHub release, then
# paste the asset hash into flake.nix `linuxResources.hash`.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release tag to attach the tarball to (e.g. v0.1.3)"
        required: false
        type: string
  push:
    tags:
      - "v*"
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: desktop-linux-resources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Linux resources tarball
    # First tag push uploads assets. Force-moving the tag onto flake.lock must
    # not rebuild — a new tarball at the same versioned URL would break the pin.
    if: github.event_name == 'workflow_dispatch' || github.event.created
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pin bundled Node to runner Node
        run: |
          echo "ROXYSU_NODE_VERSION=$(node -p process.versions.node)" >> "$GITHUB_ENV"
          echo "Bundled Node will be $(node -p process.versions.node)"

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-

      - name: Cache Node runtime downloads
        uses: actions/cache@v4
        with:
          path: apps/desktop/stage/node
          key: ${{ runner.os }}-roxysu-node-${{ env.ROXYSU_NODE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-roxysu-node-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync package versions from release tag
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        run: |
          RAW="${{ inputs.release_tag || github.ref_name }}"
          VER="${RAW#desktop-}"
          VER="${VER#v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Could not parse semver from tag/ref: $RAW"
            exit 1
          fi
          echo "Setting apps/desktop + apps/server version to $VER (from $RAW)"
          node -e "
            const fs = require('fs');
            for (const p of ['apps/desktop/package.json', 'apps/server/package.json']) {
              const j = JSON.parse(fs.readFileSync(p, 'utf8'));
              j.version = process.argv[1];
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            }
          " "$VER"

      - name: Build Linux resources tarball
        run: bun run desktop:dist:linux-resources
        env:
          ROXYSU_NODE_VERSION: ${{ env.ROXYSU_NODE_VERSION }}

      - name: Print nix hash hint
        run: |
          ART="$(ls apps/desktop/release/Roxysu-[0-9]*-linux-x64-resources.tar.gz | head -1)"
          echo "Artifact: $ART"
          echo "Stable: apps/desktop/release/Roxysu-linux-x64-resources.tar.gz"
          echo "Size: $(du -h "$ART" | cut -f1)"
          echo "sha256 (hex): $(sha256sum "$ART" | awk '{print $1}')"
          echo "After the release is published, refresh the flake lock with:"
          echo "  nix flake update linux-resources"

      - name: Upload resources artifact
        uses: actions/upload-artifact@v4
        with:
          name: roxysu-linux-resources-${{ github.ref_name }}
          path: |
            apps/desktop/release/Roxysu-[0-9]*-linux-x64-resources.tar.gz
            apps/desktop/release/Roxysu-linux-x64-resources.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Attach tarball to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            apps/desktop/release/Roxysu-[0-9]*-linux-x64-resources.tar.gz
            apps/desktop/release/Roxysu-linux-x64-resources.tar.gz
          fail_on_unmatched_files: true
