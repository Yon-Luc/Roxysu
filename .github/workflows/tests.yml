name: Tests

# The desktop workflows build and package but never exercise the test suite.
# There are 200+ test files and a root `typecheck` script; this workflow is the
# only gate that runs either before a release artifact is produced.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
