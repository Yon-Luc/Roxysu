<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roxysu</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #12141a;
        --fg: #e8eaef;
        --muted: #9aa3b5;
        --accent: #7eb8ff;
        --ring: #3d5a80;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(ellipse 80% 50% at 50% -20%, #1e3a5f 0%, transparent 55%),
          var(--bg);
        color: var(--fg);
        user-select: none;
        -webkit-app-region: drag;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 1.75rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.9375rem;
        line-height: 1.45;
        min-height: 1.45em;
      }
      .spinner {
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 50%;
        border: 3px solid var(--ring);
        border-top-color: var(--accent);
        animation: spin 0.75s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .dots::after {
        content: "";
        animation: dots 1.2s steps(4, end) infinite;
      }
      @keyframes dots {
        0% {
          content: "";
        }
        25% {
          content: ".";
        }
        50% {
          content: "..";
        }
        75% {
          content: "...";
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="spinner" aria-hidden="true"></div>
      <h1>Roxysu</h1>
      <p id="status" class="dots">Starting</p>
    </main>
  </body>
</html>
