# Coolify: New Resource → Docker Compose (paste or set compose path to this file).
# Pulls the prebuilt Hub image. Do not use `ports:` — Coolify's proxy maps the domain.
#
# Before deploy:
# 1. Add registry publier.yonx.app in Coolify (credentials to pull).
# 2. Set secrets in the Environment Variables tab (they substitute ${...} below).
# 3. Assign a domain to the hub service; set OSU_REDIRECT_URI to https://<that-domain>/auth/callback
#    and register the same URI on osu! OAuth.

services:
  hub:
    image: publier.yonx.app/roxysu/hub:latest
    restart: unless-stopped
    expose:
      - "4322"
    environment:
      - SERVICE_FQDN_HUB_4322
      - HUB_ENV=production
      - NODE_ENV=production
      - PORT=4322
      - DATABASE_URL=/app/data/hub.sqlite
      - HUB_TRUST_PROXY=1
      - HUB_CACHE_TTL_MS=86400000
      - CORS_ORIGIN=http://127.0.0.1:4321,http://localhost:4321
      - HUB_CLIENT_REDIRECT_URI=http://127.0.0.1:4321/#/hub-callback
      - HUB_DESKTOP_REDIRECT_URI=http://127.0.0.1:4321/api/system/hub-oauth/complete
      - OSU_CLIENT_ID=${OSU_CLIENT_ID}
      - OSU_CLIENT_SECRET=${OSU_CLIENT_SECRET}
      - OSU_REDIRECT_URI=${OSU_REDIRECT_URI}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_OSU_ID=${ADMIN_OSU_ID}
    volumes:
      - hub-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:4322/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  hub-data:
